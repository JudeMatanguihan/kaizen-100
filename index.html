<html lang="en">
<head>

<meta name="theme-color" content="#0f1115">

<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14161a;--mute:#6b7280;--line:#e3e6eb;--accent:#2f6df6;--accent2:#e8590c;--good:#12a150;--warn:#d97706;--bad:#d92d20;--soft:#eef3ff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#181b21;--ink:#eceef2;--mute:#9aa1ad;--line:#272b33;--accent:#6b9bff;--accent2:#ff8a4c;--good:#3ccf7e;--warn:#f0a43a;--bad:#ff6b5e;--soft:#1d2433}}
:root[data-theme=dark]{--bg:#0f1115;--card:#181b21;--ink:#eceef2;--mute:#9aa1ad;--line:#272b33;--accent:#6b9bff;--accent2:#ff8a4c;--good:#3ccf7e;--warn:#f0a43a;--bad:#ff6b5e;--soft:#1d2433}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{padding:calc(16px + env(safe-area-inset-top)) 16px 4px;max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
main{max-width:760px;margin:0 auto;padding:8px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}.row>.full{flex-basis:100%}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:42px;text-align:left}
input[type=number],input[type=text],input[type=date],input[type=password],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:84px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.sm{padding:6px 10px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:150px;background:transparent;color:var(--mute);border-radius:0;padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--accent)}nav .ic{font-size:20px}
.big{font-size:28px;font-weight:700}.mute{color:var(--mute)}.small{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px}.stat .v{font-size:20px;font-weight:700}.stat .l{font-size:12px;color:var(--mute)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.chk:last-child{border:0}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.scale{display:flex;gap:6px}.scale button{flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:8px 0}.scale button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--soft);color:var(--accent)}
.pill.good{background:#12a15022;color:var(--good)}.pill.warn{background:#d9770622;color:var(--warn)}.pill.bad{background:#d92d2022;color:var(--bad)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.coach h4{margin:12px 0 4px;font-size:14px}.coach ul{margin:4px 0 0;padding-left:18px}.coach li{margin:3px 0}
svg text{fill:var(--mute);font-size:10px}
.tag{font-size:12px;color:var(--mute)}
.hide{display:none}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.wk{border:1px solid var(--line);border-radius:10px;padding:6px 0;text-align:center;font-size:12px;background:var(--card);cursor:pointer}.wk.on{border-color:var(--accent);background:var(--soft)}
.daydot{width:100%;aspect-ratio:1;border-radius:6px;background:var(--line);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--mute);cursor:pointer}
</style>
</head>
<body>
<header><h1>🔥 Kaizen 100 <span class="tag" id="hdrDay"></span></h1><button class="ghost sm" id="themeBtn">Theme</button></header>
<main id="view"></main>
<nav id="nav"></nav>

<script>
/* ============================================================
   Kaizen 100 — a 100-day fitness & mind tracker.
   Formulas ported from the "Kaizen" Google Sheet (v7.0):
   - Trend weight: EMA, 16-day (male, a=.1176) / 20-day (female, a=.0952)
   - Calorie intake: 10-day EMA (a=.1818); est. TDEE smoothed with 10-day EMA (a=.1818)
   - Weekly delta x1100 (kg) or x500 (lb) = est. daily deficit / surplus
   - Starting calories: Mifflin-St Jeor BMR x (activity + training), cut/bulk ranges rounded to 25
   - Protein: lean mass (from BMI/age/sex body-fat estimate) x 1.0-1.3 g per lb
   - Score: Total = 40% Fitness + 60% Habit  (Fitness = 30% workouts, 30% calories, 25% protein, 15% steps;
            Habit = 80% daily habits, 20% weekly review)
   ============================================================ */
const DAYS=100, KEY='kaizen100.v1';
const ACT={"Sedentary (Below 5000 steps/day)":1.2,"Lightly Active (5000 to 7499 steps/day)":1.375,"Moderately Active (7500 to 9999 steps/day)":1.55,"Active (10,000 to 14,999)":1.725,"Very Active (15,000+ steps/day)":1.9};
const TRAIN={"0 sessions":0,"1-2 sessions":.07,"3-6 sessions":.15,"7+ sessions":.3};
const $=s=>document.querySelector(s);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const avg=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((p,c)=>p+c,0)/a.length:null};
const f=(v,d=1)=>v==null?'—':(+v).toFixed(d);
const fi=v=>v==null?'—':Math.round(v).toLocaleString();

let S=load();
function defaults(){return{setup:{unit:'kg',gender:'Male',age:null,startWeight:null,ft:null,inch:null,activity:"Lightly Active (5000 to 7499 steps/day)",sessions:"3-6 sessions",minGoal:null,targetGoal:null,dreamGoal:null,mode:'Cut',startDate:iso(new Date())},
 habits:['Read','Journal','Habit 3 (optional)','Habit 4 (optional)','Habit 5 (optional)'],days:{},weeks:{},apiKey:'',tab:'today',cur:iso(new Date()),wk:1}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j){const d=defaults();return{...d,...j,setup:{...d.setup,...j.setup}}}}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- core calculations (ported from the sheet) ---------- */
function setupCalc(){
  const s=S.setup, lbs=s.unit==='lbs', male=s.gender==='Male';
  const wLb=lbs?s.startWeight:s.startWeight*2.205, inches=s.ft*12+ +s.inch;
  const bmr=10*(wLb/2.205)+6.25*(inches*2.54)-5*s.age+(male?5:-161);
  const mult=(ACT[s.activity]||1.375)+(TRAIN[s.sessions]??.15);
  const tdee=bmr*mult, k=lbs?500:1100, W=s.startWeight;
  const c25=x=>Math.ceil(x/25)*25, f25=x=>Math.floor(x/25)*25;
  const cutLo=c25(tdee-W*(male?.0115:.01)*k), cutHi=f25(tdee-W*(male?.0075:.006)*k);
  const bulkLo=f25(tdee+(W*.01/4)*k), bulkHi=c25(tdee+(W*.02/4)*k);
  const bmi=703*(lbs?s.startWeight:s.startWeight*2.204)/(inches*inches), F=male?0:1;
  const bf=(-44.988+.503*s.age+10.689*F+3.172*bmi-.026*bmi*bmi+.181*bmi*F-.02*bmi*s.age-.005*bmi*bmi*F+.00021*bmi*bmi*s.age)*.01;
  const lean=wLb-wLb*bf;
  return{bmr,tdee,cutLo,cutHi,bulkLo,bulkHi,bmi,bf,protLo:Math.round(lean),protHi:Math.round(lean*1.3),
    rocLo:W*(male?.0075:.006),rocHi:W*(male?.0115:.01),male,lbs}}
function dayN(date){return Math.round((parse(date)-parse(S.setup.startDate))/864e5)+1}
function dateOfDay(n){return addDays(S.setup.startDate,n-1)}
function weekOf(n){return Math.min(15,Math.ceil(n/7))}
function wkTargets(w){const t=(S.weeks[w]||{}).t||{};const sc=setupCalc();const cut=S.setup.mode==='Cut';
  const dflt=cut?(sc.cutHi+sc.cutLo)/2:(sc.bulkLo+sc.bulkHi)/2;
  const prev=w>1?wkTargets(w-1):null;
  return{steps:t.steps??prev?.steps??7500,cal:w===1?null:(t.cal??prev?.cal??Math.round(dflt/25)*25),prot:w===1?null:(t.prot??prev?.prot??sc.protLo),workouts:t.workouts??prev?.workouts??4}}
function maintFor(w){const ser=series(Math.min(w*7,DAYS));let v=null;for(let i=ser.length-1;i>=0;i--)if(ser[i].tdee!=null){v=ser[i].tdee;break}
  const sc=setupCalc(),cut=S.setup.mode==='Cut',m=v??sc.tdee,k=sc.lbs?500:1100,W=ser[ser.length-1]?.tw??S.setup.startWeight,c25=x=>Math.round(x/25)*25;
  return{tdee:m,fromData:v!=null,lo:cut?c25(m-W*(sc.male?.0115:.01)*k):c25(m+W*.01/4*k),hi:cut?c25(m-W*(sc.male?.0075:.006)*k):c25(m+W*.02/4*k)}}
/* series: trend weight EMA, calorie EMA, est TDEE — one entry per challenge day up to "upTo" */
function series(upTo){
  const sc=setupCalc(), aW=sc.male?.1176:.0952, aC=.1818, aT=.1818; const out=[]; let tw=null,ce=null,tdee=null,cum=[];
  for(let n=1;n<=upTo;n++){
    const d=S.days[dateOfDay(n)]||{}, w=num(d.weight), c=num(d.calories);
    if(w==null){ if(tw==null)tw=S.setup.startWeight } else tw=(tw==null||n===1)?w:aW*w+(1-aW)*tw;
    if(n===1&&w==null)tw=S.setup.startWeight;
    if(c!=null){cum.push(c);const sma=avg(cum);ce=ce==null?sma:aC*c+(1-aC)*ce}
    const prevTw=n>7?out[n-8].tw:null;
    const dlt=prevTw!=null&&w!=null?tw-prevTw:(n>7?out[n-2]?.dlt??null:null);
    const deficit=dlt==null?null:dlt*(sc.lbs?500:1100);
    const win=out.slice(-9).concat([{w,c}]);
    const waitW=win.filter(x=>x.w==null).length>5, waitC=win.filter(x=>x.c==null).length>3;
    const raw=(deficit!=null&&ce!=null)?ce-deficit:null;
    if(raw!=null&&!waitW&&!waitC) tdee=tdee==null?raw:aT*raw+(1-aT)*tdee;
    out.push({n,date:dateOfDay(n),w,c,tw,ce,dlt,pct:prevTw?dlt/prevTw:null,deficit,tdee});
  }return out}
function dayScore(date){
  const d=S.days[date];if(!d)return null;const n=dayN(date);const photo=n%7===0;
  const items=[[d.sleep!=null,1],[num(d.weight)!=null,1],[d.water,1],[(d.plan||'').trim()!=='',1],
    ...S.habits.map((h,i)=>[!!(d.habits||[])[i],/optional/i.test(h)?0:1]),
    [d.stress!=null,1],[d.fatigue!=null,1],[d.hunger!=null,1],[(d.wins||'').trim()!=='',1],[(d.improve||'').trim()!=='',1],
    [!!d.goals,1],[!!d.planned,1],[!!d.tracker,1]];
  if(photo)items.push([!!d.measured,1],[!!d.photos,1],[!!d.loggedM,1],[!!d.uploaded,1]);
  const max=items.reduce((p,c)=>p+c[1],0), got=items.reduce((p,c)=>p+(c[0]?c[1]:0),0);return max?got/max:0}
function weekStats(w){
  const t=wkTargets(w), sc=setupCalc(), cut=S.setup.mode==='Cut'; const ds=[];
  for(let i=0;i<7;i++){const n=(w-1)*7+i+1;if(n<=DAYS)ds.push({n,date:dateOfDay(n),d:S.days[dateOfDay(n)]||{}})}
  const L=ds.length||7, g=k=>ds.map(x=>num(x.d[k]));
  const wo=ds.filter(x=>x.d.workout).length, cals=g('calories').filter(x=>x!=null), steps=g('steps').filter(x=>x!=null), prot=g('protein');
  const calAvg=avg(cals), stepAvg=avg(steps);
  const woS=t.workouts?Math.min(wo/t.workouts,1):1;
  const calEnt=cals.length/L; let calS=null;
  if(t.cal!=null&&calAvg!=null){const base=cut?(calAvg<=t.cal?1:1-((calAvg-t.cal)*7/3500)):(calAvg>=t.cal?1:1-((t.cal-calAvg)*7/3500));calS=Math.max(0,base)*calEnt}
  const protS=t.prot==null?null:prot.reduce((p,v)=>p+(v==null||v===0?0:Math.min(v/t.prot,1)),0)/L;
  const stEnt=steps.length/L; let stS=null; if(stepAvg!=null)stS=(stepAvg>=t.steps?1:Math.max(0,1-(t.steps-stepAvg)/t.steps))*stEnt;
  const base=w===1;const have=stS!=null&&(base||calS!=null);
  const fitness=!have?0:base?(.3*woS+.15*stS)/.45:.3*woS+.3*calS+.25*protS+.15*stS;
  const daily=avg(ds.map(x=>S.days[x.date]?dayScore(x.date):null))??0;
  const wr=S.weeks[w]||{};
  const rev=[wr.adjust,(wr.wins||'').trim(),(wr.challenges||'').trim(),(wr.adjustments||[]).length>0||(wr.actions||'').trim(),(wr.actions||'').trim()].filter(Boolean).length/5;
  const habit=.8*daily+.2*rev, total=.4*fitness+.6*habit;
  return{t,wo,calAvg,stepAvg,protHits:t.prot==null?null:prot.filter(v=>v!=null&&v>=t.prot).length,woS,calS,protS,stS,fitness,daily,rev,habit,total,
    stress:avg(g('stress')),fatigue:avg(g('fatigue')),hunger:avg(g('hunger')),sleep:avg(g('sleep')),L}}

/* ---------- local AI-style coach (works offline) ---------- */
const THEMES={
 sleep:[/sleep|tired|insomnia|woke|exhaust|rest(ed)?\b|nap/i,"Sleep keeps coming up. Protect a fixed wind-down time and aim for 7–9 hours; poor sleep raises hunger and lowers workout output."],
 stress:[/stress|anx|overwhelm|worr|pressure|deadline|burn(ed)?\s?out/i,"Stress is showing in your notes. Try a 10-minute walk or 5 minutes of slow breathing before meals; high stress makes cravings louder."],
 craving:[/crav|binge|snack|junk|cheat|overate|over-ate|sweets|chocolate|pizza|fast food/i,"Cravings or overeating showed up. Plan one satisfying treat inside your calories, keep protein high at each meal, and pre-log tomorrow's food."],
 time:[/no time|busy|late|schedule|work(ed)? late|skipp?ed|missed|forgot/i,"Time and schedule are the blocker. Shrink the habit: a 20-minute minimum workout and a calendar slot beat a perfect plan you skip."],
 motiv:[/motivat|lazy|don'?t feel|unmotivated|discourag|give up|quit|frustrat|hopeless|failed|failure|guilty/i,"It sounds like motivation dipped. That is normal on a 100-day run. Lean on systems, not feelings: do the smallest version of today's plan."],
 pain:[/pain|injur|sore|strain|knee|back hurts|shoulder|sick|ill\b|flu|cold\b/i,"You mentioned pain or illness. Train around it, reduce intensity, and rest if it is sharp or lasting. Do not push through an injury."],
 social:[/party|dinner out|restaurant|travel|trip|holiday|birthday|friends|family/i,"Social or travel moments are coming up. Look at the menu first, protein first, and keep the next meal normal rather than 'making up' for it."],
 win:[/hit|crush|pr\b|personal best|finished|completed|proud|nailed|on track|stuck to|consistent|streak|walked|lifted|trained|worked out|ran\b/i,null]};
function coachFor(date){
  const d=S.days[date]||{}, n=dayN(date), w=weekOf(n), t=wkTargets(w), sc=setupCalc(), cut=S.setup.mode==='Cut';
  const txt=[d.wins,d.improve,d.plan].join(' '), ser=series(Math.min(n,DAYS)), me=ser[n-1]||{};
  const praise=[],obs=[],tips=[];
  const sleep=d.sleep,stress=d.stress,fat=d.fatigue,hun=d.hunger,cal=num(d.calories),pro=num(d.protein),st=num(d.steps);
  const winLines=(d.wins||'').split(/\n|;|\.\s|\.$|\d\.|•|\s-\s/).map(s=>s.trim()).filter(s=>s.length>3);
  if(winLines.length>=3)praise.push(`You logged ${winLines.length} wins today. Naming wins builds the identity that keeps you going.`);
  else if(winLines.length)praise.push(`You noticed a win today: "${winLines[0].slice(0,80)}". Try for 3–5 so your brain learns to spot progress.`);
  if(d.workout)praise.push('Workout done. That is the habit that compounds.');
  if(t.prot!=null&&pro!=null&&pro>=t.prot)praise.push(`Protein target hit (${fi(pro)} g). That protects muscle while you ${cut?'cut':'build'}.`);
  if(st!=null&&st>=t.steps)praise.push(`Steps target crushed (${fi(st)}).`);
  if(cal!=null&&t.cal==null)praise.push(`Calories logged (${fi(cal)}). Week 1 is baseline, so there is no calorie or protein target yet; your data sets Week 2.`);
  else if(cal!=null){const ok=cut?cal<=t.cal:cal>=t.cal;
    if(ok)praise.push(`Calories on target (${fi(cal)} vs ${fi(t.cal)}).`);
    else obs.push(`Calories were ${fi(Math.abs(cal-t.cal))} ${cut?'over':'under'} your ${fi(t.cal)} target. One day barely moves the trend; the weekly average is what counts.`)}
  if(t.prot!=null&&pro!=null&&pro<t.prot)obs.push(`Protein is ${fi(t.prot-pro)} g short. Add a high-protein anchor (eggs, Greek yogurt, chicken, whey) to your first and last meal.`);
  if(st!=null&&st<t.steps*.7)tips.push(`Steps are well under ${fi(t.steps)}. A 15–20 minute walk after dinner closes most of the gap.`);
  if(sleep!=null&&sleep<=2)obs.push('Sleep quality was low.'),tips.push('Tonight: screens off 45 minutes earlier, cool dark room, no caffeine after midday.');
  if(stress!=null&&stress>=4)obs.push('Stress was high today.'),tips.push('When stress is 4–5, lower the bar instead of skipping. Do a lighter session, keep protein, and sleep.');
  if(fat!=null&&fat>=4)tips.push('Fatigue is high. Consider a lower-volume day or a deload if it repeats 3+ days.');
  if(hun!=null&&hun>=4)tips.push('Hunger was intense. Add volume foods (vegetables, fruit, soups), more protein and fibre, and drink water before meals.');
  for(const k in THEMES){const [re,msg]=THEMES[k];if(re.test(txt)&&msg)tips.push(msg)}
  if(!THEMES.win[0].test(d.wins||'')&&!winLines.length)tips.push('Add at least one win, even a small one: "I logged my food" counts.');
  if(me.pct!=null&&d.weight!=null){
    const ok=cut?(me.dlt<=0&&-me.dlt>=sc.rocLo*.9&&-me.dlt<=sc.rocHi*1.15):me.dlt>=0;
    if(cut&&me.dlt>0.1)obs.push(`Trend weight is up ${f(me.dlt,2)} ${S.setup.unit} vs last week. Do not react to one weigh-in; adjust only if the trend holds for the full week.`);
    else if(cut&&-me.dlt>sc.rocHi*1.2)obs.push(`You are losing ${f(-me.dlt,2)} ${S.setup.unit}/week, faster than the ${f(sc.rocHi,2)} guide. Eat a bit more to protect muscle and energy.`);
    else if(ok)praise.push(`Your trend rate (${f(me.dlt,2)} ${S.setup.unit}/wk) is in a healthy range.`)}
  if((d.improve||'').trim().split(/\s+/).filter(Boolean).length<4)tips.push('Make "do better tomorrow" concrete: what, when, and where (e.g. "walk 20 min at 6 pm after dinner").');
  if(!praise.length)praise.push('You showed up and logged. Consistency beats intensity over 100 days.');
  const focus=tips[0]||'Repeat what worked today and protect your sleep.';
  const left=DAYS-n;
  return{praise,obs,tips:[...new Set(tips)].slice(0,5),focus,closing:left>0?`Day ${n} of ${DAYS}. ${left} days to go: 1% better today.`:'You finished the 100 days. Be proud of the work.'}}
function weekCoach(w){
  const s=weekStats(w), wr=S.weeks[w]||{}, sc=setupCalc(), cut=S.setup.mode==='Cut', t=s.t;
  const p=[],o=[],tp=[];
  p.push(`Week ${w} total score: ${(s.total*100).toFixed(0)}% (fitness ${(s.fitness*100).toFixed(0)}%, habits ${(s.habit*100).toFixed(0)}%).`);
  if(s.wo>=t.workouts)p.push(`Hit ${s.wo}/${t.workouts} workouts.`);else o.push(`${s.wo}/${t.workouts} workouts. Pre-book next week's sessions in your calendar.`);
  if(t.cal==null){if(s.calAvg!=null)p.push(`Baseline calorie average: ${fi(s.calAvg)}. This anchors your Week 2 target.`)}
  else if(s.calAvg!=null){const ok=cut?s.calAvg<=t.cal:s.calAvg>=t.cal;ok?p.push(`Calorie average ${fi(s.calAvg)} is on target.`):o.push(`Calorie average ${fi(s.calAvg)} vs target ${fi(t.cal)}. ${cut?'Tighten weekend portions and weigh food for 3 days to recalibrate.':'Add a calorie-dense snack (nuts, milk, rice).'}`)}
  if(t.prot!=null&&s.protHits<5)o.push(`Protein target hit on ${s.protHits}/7 days. Aim for ≥5.`);

function lineChart(ser,opts={}){
  const W=700,H=220,p={l:36,r:10,t:10,b:22}; const pts=ser.filter(x=>x.tw!=null);
  if(pts.length<2)return'<p class="mute small">Log a few weigh-ins to see your trend chart.</p>';
  const vals=ser.flatMap(x=>[x.w,x.tw]).filter(v=>v!=null).concat([S.setup.targetGoal,S.setup.startWeight]);
  let lo=Math.min(...vals)-.5,hi=Math.max(...vals)+.5; const X=n=>p.l+(n-1)/(DAYS-1)*(W-p.l-p.r), Y=v=>p.t+(1-(v-lo)/(hi-lo))*(H-p.t-p.b);
  const path=k=>{let d='',pen=false;ser.forEach(x=>{if(x[k]==null){return}d+=(pen?'L':'M')+X(x.n).toFixed(1)+' '+Y(x[k]).toFixed(1);pen=true});return d};
  let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="4" y="${Y(v)+3}">${v.toFixed(1)}</text>`}
  [1,25,50,75,100].forEach(n=>g+=`<text x="${X(n)-6}" y="${H-6}">${n}</text>`);
  const goals=[[S.setup.targetGoal,'Target']].map(([v,l])=>`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--good)" stroke-dasharray="4 4"/><text x="${W-60}" y="${Y(v)-3}" style="fill:var(--good)">${l} ${v}</text>`).join('');
  const dots=ser.filter(x=>x.w!=null).map(x=>`<circle cx="${X(x.n)}" cy="${Y(x.w)}" r="2.6" fill="var(--mute)" opacity=".6"/>`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight and trend chart">${g}${goals}${dots}<path d="${path('tw')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/></svg><p class="small mute"><span style="color:var(--accent)">━</span> trend weight &nbsp;<span>●</span> daily weigh-in</p>`}
function bars(vals,max,color,target){
  const W=300,H=70,bw=W/vals.length; const m=Math.max(max,...vals.filter(v=>v!=null),target||0,1);
  return`<svg viewBox="0 0 ${W} ${H+14}" width="100%">${vals.map((v,i)=>`<rect x="${i*bw+6}" y="${H-(v||0)/m*H}" width="${bw-12}" height="${(v||0)/m*H}" rx="3" fill="${color}" opacity="${v==null?.15:.9}"/>`).join('')}${target?`<line x1="0" x2="${W}" y1="${H-target/m*H}" y2="${H-target/m*H}" stroke="var(--mute)" stroke-dasharray="3 3"/>`:''}</svg>`}

   ${["Be more consistent logging food","Be more accurate measuring food","Do a better job hitting calorie targets","Raise/lower calories","Raise steps","Add a workout"].map((o,i)=>`<label class="chk"><input type="checkbox" data-adj="${o}" ${(wr.adjustments||[]).includes(o)?'checked':''}><span>${o}</span></label>`).join('')}
   <label>🤗 2–3 big actions to make next week better</label><textarea id="w_actions">${esc(wr.actions)}</textarea>
   <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button id="wCoach">🧠 Assess my week</button>${S.apiKey?'<button class="ghost" id="wClaude">✨ Ask Claude</button>':''}</div>
   <div id="wOut" style="margin-top:10px">${wr.coach?coachHTML(wr.coach):''}${wr.claude?`<div class="card" style="background:var(--soft)"><b>✨ Claude</b><div style="white-space:pre-wrap;margin-top:6px">${esc(wr.claude)}</div></div>`:''}</div></div>`;
  const W=()=>S.weeks[w]=S.weeks[w]||{};
  document.querySelectorAll('.wk').forEach(e=>e.onclick=()=>{S.wk=+e.dataset.w;save();vWeek()});
  [...(w===1?[]:[['t_cal','cal']]),...(w===1?[]:[['t_prot','prot']]),['t_steps','steps'],['t_workouts','workouts']].forEach(([id,k])=>$('#'+id).onchange=e=>{const o=W();o.t=o.t||{};o.t[k]=num(e.target.value);save();vWeek()});
  $('#w_adjust').onchange=e=>{W().adjust=e.target.value;save()};
  [['w_wins','wins'],['w_challenges','challenges'],['w_actions','actions']].forEach(([id,k])=>$('#'+id).oninput=e=>{W()[k]=e.target.value;save()});
  document.querySelectorAll('input[data-adj]').forEach(el=>el.onchange=()=>{const o=W();o.adjustments=(o.adjustments||[]).filter(x=>x!==el.dataset.adj);if(el.checked)o.adjustments.push(el.dataset.adj);save()});
  $('#wCoach').onclick=()=>{W().coach=weekCoach(w);save();$('#wOut').innerHTML=coachHTML(S.weeks[w].coach)};
  const wc=$('#wClaude');if(wc)wc.onclick=async()=>{wc.disabled=true;wc.textContent='Thinking…';try{
    const txt=await claudeCoach(`Weekly review, week ${w}, mode ${S.setup.mode}`,{targets:t,stats:{...ws,t:undefined},review:{...wr,coach:undefined,claude:undefined},trend:last&&{trendWeight:last.tw,weeklyChange:last.dlt,estTDEE:last.tdee},unit:S.setup.unit});
    W().claude=txt;save();vWeek()}catch(e){wc.disabled=false;wc.textContent='✨ Ask Claude';alert(e.message)}}}

function vCoach(){
  const dates=Object.keys(S.days).filter(d=>S.days[d].wins||S.days[d].improve||S.days[d].obstacles).sort().reverse().slice(0,30);
  $('#view').innerHTML=`<div class="card"><h2>🧠 Your coach</h2><p class="small mute">Write your wins, do-better-tomorrow and obstacles on the Today tab, then tap "Get my assessment". The built-in coach reads your numbers and words and works offline. Add an Anthropic API key in Setup to also ask Claude.</p></div>
   ${dates.length?dates.map(d=>`<div class="card"><b>Day ${dayN(d)}</b> <span class="tag">${d}</span><p class="small"><b>Wins:</b> ${esc(S.days[d].wins||'—')}</p><p class="small"><b>Do better:</b> ${esc(S.days[d].improve||'—')}</p>${S.days[d].obstacles?`<p class="small"><b>Obstacles:</b> ${esc(S.days[d].obstacles)}</p>`:''}${S.days[d].coach?coachHTML(S.days[d].coach):`<button class="ghost sm" data-c="${d}">Assess this day</button>`}</div>`).join(''):'<div class="card mute">No journal entries yet.</div>'}`;
  document.querySelectorAll('button[data-c]').forEach(b=>b.onclick=()=>{S.days[b.dataset.c].coach=coachFor(b.dataset.c);save();vCoach()})}

function vSetup(){
  const s=S.setup, sc=setupCalc(), sel=(id,opts,val)=>`<select id="${id}">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
  $('#view').innerHTML=`${ready()?'':'<div class="card" style="background:var(--soft)"><b>Welcome 👋</b><p class="small" style="margin:6px 0 0">Pick your Day 1 and fill in the profile below. Everything starts blank; the app unlocks once start date, age, height, starting weight and target goal are set.</p></div>'}<div class="card"><h2>Profile</h2><div class="row">
   <div class="full"><label>Day 1 (challenge start date)</label><input id="s_startDate" type="date" value="${s.startDate}"><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button class="ghost sm" id="startToday">Start today</button><button class="ghost sm" id="startTomorrow">Start tomorrow</button></div><p class="tag" style="margin:6px 0 0">Day 100 ends ${dateOfDay(DAYS)}</p></div>
   <div><label>Mode</label>${sel('s_mode',['Cut','Bulk'],s.mode)}</div>
   <div><label>Weight unit</label>${sel('s_unit',['kg','lbs'],s.unit)}</div>
   <div><label>Biological gender</label>${sel('s_gender',['Male','Female'],s.gender)}</div></div>
   <div class="row">${field('s_age','Age','number',s.age)}${field('s_startWeight','Starting weight','number',s.startWeight,'step="0.05"')}${field('s_ft','Height (ft)','number',s.ft)}${field('s_inch','Height (in)','number',s.inch)}</div>
   <label>Planned average steps/day</label>${sel('s_activity',Object.keys(ACT),s.activity)}
   <label>Planned lifting sessions/week</label>${sel('s_sessions',Object.keys(TRAIN),s.sessions)}
   <div class="row">${field('s_minGoal','Minimum goal weight','number',s.minGoal,'step="0.1"')}${field('s_targetGoal','Target goal weight','number',s.targetGoal,'step="0.1"')}${field('s_dreamGoal','Dream goal weight','number',s.dreamGoal,'step="0.1"')}</div></div>
  ${ready()?`<div class="card"><h2>Your starting numbers</h2><div class="grid">
   <div class="stat"><div class="l">BMR</div><div class="v">${fi(sc.bmr)}</div></div><div class="stat"><div class="l">Est. TDEE</div><div class="v">${fi(sc.tdee)}</div></div>
   <div class="stat"><div class="l">Cutting calories</div><div class="v">${fi(sc.cutLo)}–${fi(sc.cutHi)}</div></div><div class="stat"><div class="l">Bulking calories</div><div class="v">${fi(sc.bulkLo)}–${fi(sc.bulkHi)}</div></div>
   <div class="stat"><div class="l">Protein (g)</div><div class="v">${sc.protLo}–${sc.protHi}</div></div><div class="stat"><div class="l">Est. body fat</div><div class="v">${(sc.bf*100).toFixed(1)}%</div></div></div>
   <p class="small mute">Calorie ranges are for Week 2 onward; Week 1 is for logging your baseline. Estimates are not medical advice.</p></div>`:''}
  <div class="card"><h2>Daily habits (5 slots)</h2><p class="small mute">Add "optional" in the name to make a habit not count against you.</p>${S.habits.map((h,i)=>`<input type="text" data-hn="${i}" value="${esc(h)}" style="margin-bottom:6px">`).join('')}</div>
  <div class="card"><h2>Claude coach (optional)</h2><p class="small mute">The built-in coach works without this. If you add a key it stays in this browser only and is sent only to api.anthropic.com when you tap "Ask Claude".</p><input id="s_key" type="password" placeholder="sk-ant-…" value="${esc(S.apiKey)}"></div>
  <div class="card"><h2>Data</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="ghost" id="exp">⬇️ Export backup</button><button class="ghost" id="imp">⬆️ Import backup</button><button class="ghost" id="rst" style="color:var(--bad)">Reset everything</button></div><input id="impf" type="file" accept=".json" class="hide"></div>`;
  const map={s_startDate:'startDate',s_mode:'mode',s_unit:'unit',s_gender:'gender',s_activity:'activity',s_sessions:'sessions'};
  for(const id in map)$('#'+id).onchange=e=>{S.setup[map[id]]=e.target.value;if(id==='s_startDate')S.cur=e.target.value;save();vSetup()};
  ['age','startWeight','ft','inch','minGoal','targetGoal','dreamGoal'].forEach(k=>$('#s_'+k).onchange=e=>{S.setup[k]=num(e.target.value);save();render()});
  $('#startToday').onclick=()=>{S.setup.startDate=iso(new Date());S.cur=S.setup.startDate;save();vSetup()};$('#startTomorrow').onclick=()=>{S.setup.startDate=addDays(iso(new Date()),1);S.cur=S.setup.startDate;save();vSetup()};
  document.querySelectorAll('[data-hn]').forEach(el=>el.onchange=()=>{S.habits[+el.dataset.hn]=el.value;save()});
  $('#s_key').onchange=e=>{S.apiKey=e.target.value.trim();save()};
  $('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='kaizen100-backup-'+iso(new Date())+'.json';a.click()};
  $('#imp').onclick=()=>$('#impf').click();
  $('#impf').onchange=e=>{const r=new FileReader();r.onload=()=>{try{S={...defaults(),...JSON.parse(r.result)};save();render()}catch(x){alert('Not a valid backup file')}};r.readAsText(e.target.files[0])};
  $('#rst').onclick=()=>{if(confirm('Delete ALL data in this browser? Export a backup first.')){S=defaults();save();render()}}}

$('#themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
S.cur=iso(new Date());render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
